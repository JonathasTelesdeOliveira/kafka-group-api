# -------------------------------------------------------------
# APPLICATION & SERVER
# -------------------------------------------------------------
spring.application.name=agrupamento
server.port=8083

# -------------------------------------------------------------
# DATABASE (MYSQL - BANCO EXCLUSIVO)
# -------------------------------------------------------------
# O createDatabaseIfNotExist=true criará o db_agrupamento automaticamente
spring.datasource.url=jdbc:mysql://localhost:3307/db_agrupamento?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configurações do Pool de Conexão Hikari
spring.datasource.hikari.initializationFailTimeout=0
spring.datasource.hikari.connectionTimeout=30000

# Desativa execução de docker-compose automático via Spring Boot Bootstrapping
spring.docker.compose.enabled=false

# -------------------------------------------------------------
# JPA / HIBERNATE
# -------------------------------------------------------------
# create-drop ou create recria as tabelas a cada inicialização (ótimo para ambiente de dev)
spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# -------------------------------------------------------------
# Kafka
# =========================
spring.kafka.bootstrap-servers=localhost:9092
logging.level.org.springframework.kafka=DEBUG
# Consumer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# -------------------------------------------------------------
# SWAGGER & MVC
# -------------------------------------------------------------
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs